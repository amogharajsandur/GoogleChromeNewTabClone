<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab (Clone) – By Amogha Raj Sandur</title>
    <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Google_Chrome_icon_%28February_2022%29.svg/128px-Google_Chrome_icon_%28February_2022%29.svg.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navigation-bar">
        <div class="text-box">
            <a href="https://mail.google.com/mail/?tab=rm&authuser=0&ogbl" target="_blank">Gmail</a>
            <a href="https://www.google.com/imghp?hl=en-GB&tab=ri&authuser=0&ogbl" target="_blank">Images</a>
        </div>
        <div class="icon-box">
            <img src="assets/apps icon.svg" alt="Google Apps" >
        </div>
        <div class="icon-box">
            <a href="https://myaccount.google.com/" target="_blank">
                <img src="assets/profile icon.svg" alt="Google Account" class="profile-icon">
            </a>
        </div>
    </div>
    <div class="main-content">
        <div class="upper-centre">
            <img src="assets/google white logo.png" alt="Google">
        </div>
        <div class="lower-centre">
            <div class="input-box">
                <div class="icon-box" id="search-icon">
                    <img class="input-icons" src="assets/search icon black.svg" alt="Search Google or type a URL">
                </div>
                <form action="https://www.google.com/search" method="get" target="">
                    <input type="text" name="q" placeholder="Search Google or type a URL" autocomplete="off" required>
                    <!-- Autocomplete is off so the browser tab doesn't remember what the previous search was. -->
                    <!-- <button type="submit">Search</button> -->
                </form>                  
                <div class="icon-box">
                    <img class="input-icons" src="assets/mic icon black.svg" alt="Search by voice">
                </div>
                <div class="icon-box">
                    <img class="input-icons" src="assets/add photo icon black.svg" alt="Search by image">
                </div>
            </div>
            <div class="shortcuts-box">
                <div class="shortcut-apps">

                </div>
            </div>
        </div>
    </div>
    <div class="footer-bar">
        <div class="text-box">
            <a href="https://www.linkedin.com/in/amogharajsandur/" target="_blank">This is Google Chrome's New Tab (Clone) – By <span>Amogha Raj Sandur</span></a>
        </div>
        <div class="icon-box">
            <img src="assets/edit icon.svg" alt="Customize this page">
        </div>
    </div>
</body>
</html>
